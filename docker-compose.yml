version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# SafeHer — Full stack docker-compose
# Services: API (4 workers) + MongoDB replica set + Redis + Nginx reverse proxy
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safeher-api
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      DEBUG: "false"
      WORKERS: "4"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - ml_models:/app/app/ml/models
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - safeher-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: safeher-mongo
    restart: unless-stopped
    command: mongod --wiredTigerCacheSizeGB 1.5 --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: safeher
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-safeher_secret}
      MONGO_INITDB_DATABASE: safeher
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - safeher-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: safeher-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --tcp-backlog 2048
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - safeher-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 600M

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: safeher-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - safeher-net
    profiles:
      - production  # only started with: docker-compose --profile production up

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  mongo_data:
  mongo_config:
  redis_data:
  uploads_data:
  ml_models:

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  safeher-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
